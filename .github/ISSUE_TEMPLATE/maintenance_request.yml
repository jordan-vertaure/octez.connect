name: Maintenance request
description: Propose an upstream intake, release hardening change, or repo maintenance task
title: "[Maintenance]: "
labels:
  - maintenance
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Describe the maintenance task or upstream intake proposal.
    validations:
      required: true

  - type: textarea
    id: provenance
    attributes:
      label: Upstream provenance
      description: Link the upstream release, commit, changelog, or issue if this comes from outside Trilitech (e.g. ecadlabs/beacon-sdk-taquito-patches or airgap-it/beacon-sdk).

  - type: textarea
    id: impact
    attributes:
      label: Impact and risk
      description: Explain who is affected, what could regress, and how the change should be validated.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: State which checks or manual flows should pass before merge.
