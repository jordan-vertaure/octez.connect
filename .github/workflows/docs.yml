name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build-docs:
    name: build-docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build API docs
        run: npm run typedoc

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy-docs:
    name: deploy-docs
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
