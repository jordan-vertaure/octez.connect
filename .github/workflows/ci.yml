name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Gate new lint findings
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            export LINT_BASE_REF="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            export LINT_BASE_REF="$PUSH_BEFORE_SHA"
          elif [ -n "$PR_BASE_REF" ]; then
            export LINT_BASE_REF="origin/$PR_BASE_REF"
          fi
          ./scripts/npm11.sh run lint:new

      - name: Check workspace versions
        run: ./scripts/npm11.sh run check:versions

      - name: Build packages
        run: ./scripts/npm11.sh run build

      - name: Run unit tests
        run: ./scripts/npm11.sh run test

  end-to-end:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Check workspace versions
        run: ./scripts/npm11.sh run check:versions

      - name: Build packages
        run: ./scripts/npm11.sh run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: ./scripts/npm11.sh run e2e:smoke

  firefox-extension-e2e:
    name: firefox-extension-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking (#32): the real-Firefox content-script harness exercises the
    # genuine Xray compartment via Selenium + geckodriver. It is the only layer
    # that reproduces the membrane bug, but it is environment-sensitive; the
    # deterministic Jest compartment tests are the CI-blocking guard.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Build packages
        run: ./scripts/npm11.sh run build

      - name: Build eval-free SDK bundle (MV3 forbids eval)
        run: ./scripts/npm11.sh run webpack:sdk:ext

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@v1

      - name: Run real-Firefox content-script harness (#32, headless via xvfb)
        run: xvfb-run -a ./scripts/npm11.sh run e2e:firefox-ext
